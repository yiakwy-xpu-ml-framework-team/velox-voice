<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Piano staff — Reaper style</title>
<script src="/score-demo/abcjs.js"></script>
<script src="/i18n.js"></script>
<style>
  :root { color-scheme: light; }
  body { margin:0; background:#eef2f7; color:#0f172a;
    font: 14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .lang-switch { position: fixed; top: 12px; right: 14px; z-index: 120;
    display: flex; align-items: center; gap: 2px; padding: 3px;
    background: #fff; border: 1px solid #ddd; border-radius: 999px;
    box-shadow: 0 2px 12px rgba(15,23,42,.08); font-size: 12px; }
  .lang-switch button { background: transparent; color: #64748b;
    border: 0; padding: 4px 9px; border-radius: 999px; font-size: 12px;
    line-height: 1.2; cursor: pointer; }
  .lang-switch button.active { background: #0ea5e9; color: #fff; }
  .lang-switch span { color: #cbd5e1; }
  .wrap { max-width:1400px; margin:24px auto 40px; padding:0 18px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:#64748b; font-size:13px; margin:0 0 12px; }
  .modebar { display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .modebar button { background:#e2e8f0; color:#334155; border:1px solid #cbd5e1;
    border-radius:8px; padding:7px 13px; cursor:pointer; font-weight:700; }
  .modebar button.active { background:#0ea5e9; color:#fff; border-color:#0ea5e9;
    box-shadow:0 0 16px rgba(14,165,233,.45); }
  #modeInfo { color:#64748b; font-size:12px; margin-left:6px; }
  .shell { position:relative; overflow:hidden; height:430px; background:#fff;
    border:1px solid #dbe2ea; border-radius:12px;
    box-shadow:0 8px 30px rgba(15,23,42,.06); }
  #track { position:absolute; top:0; left:0; will-change: transform; }
  #track svg { display:block; }
  /* playhead: one container, a full-height line and a top arrow centred on
     exactly the same x.  The line is the actual cursor; the arrow is only a
     handle.  Both move together, so they can never drift apart. */
  #playhead { position:absolute; top:0; bottom:0; left:0; width:0;
    z-index:6; pointer-events:none; will-change: transform; }
  #playhead .line { position:absolute; top:0; bottom:0; left:-1.5px; width:3px;
    border-radius:2px;
    background:linear-gradient(180deg,#7dd3fc,#0ea5e9 55%,#0369a1);
    box-shadow:0 0 14px rgba(14,165,233,.85),0 0 30px rgba(56,189,248,.55); }
  #playhead .arrow { position:absolute; top:0; left:-8px; width:0; height:0;
    border-left:8px solid transparent; border-right:8px solid transparent;
    border-top:13px solid #0ea5e9;
    filter:drop-shadow(0 0 6px #38bdf8) drop-shadow(0 2px 1px #0369a1); }
  .controls { display:flex; align-items:center; gap:9px; margin-top:13px; flex-wrap:wrap; }
  .controls button { background:#e2e8f0; color:#0f172a; border:0; border-radius:9px;
    padding:8px 14px; cursor:pointer; font-weight:700; }
  .controls button.primary { background:#0ea5e9; color:#fff; min-width:92px; }
  #timeLabel { color:#475569; font-variant-numeric:tabular-nums; margin-left:4px; }
  .hint { color:#64748b; font-size:12px; margin-left:auto; }
  .metrics { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
  .metrics.single { grid-template-columns:1fr; }
  .card { background:#fff; border:1px solid #dbe2ea; border-radius:10px; padding:12px 14px; }
  .card h3 { margin:0 0 5px; font-size:14px; }
  .card .big { font-size:18px; font-weight:800; color:#0284c7; }
  .card p { margin:3px 0; color:#64748b; font-size:12px; }
  .card.active { border-color:#0ea5e9; box-shadow:0 0 18px rgba(14,165,233,.2); }
  /* Notation defaults to black. Only currently sounding notes get the bright
     track color + glow; notes already performed are dimmed. */
  svg .track-vocal { --play-color:#22c55e; --play-glow:rgba(34,197,94,.85); }
  svg .track-rh    { --play-color:#38bdf8; --play-glow:rgba(56,189,248,.75); }
  svg .track-lh    { --play-color:#a78bfa; --play-glow:rgba(167,139,250,.75); }
  svg .track-bass  { --play-color:#f59e0b; --play-glow:rgba(245,158,11,.8); }
  svg .melody      { --play-color:#22c55e; --play-glow:rgba(34,197,94,.95); }
  /* Default notation: black. */
  svg .track-vocal, svg .track-rh, svg .track-lh, svg .track-bass,
  svg .track-vocal *, svg .track-rh *, svg .track-lh *, svg .track-bass * {
    fill:#000 !important;
    stroke:#000 !important;
  }
  svg .playing, svg .playing * {
    fill:var(--play-color) !important;
    stroke:var(--play-color) !important;
  }
  svg .playing {
    filter: drop-shadow(0 2px 1px rgba(15,23,42,.35))
            drop-shadow(0 0 8px var(--play-glow))
            drop-shadow(0 0 16px var(--play-glow));
  }
  svg .past, svg .past * {
    fill:#374151 !important;
    stroke:#374151 !important;
  }
  /* Click-to-audition: selected notes use the same lane color/glow as
     playback, with a pulse so the selection remains distinguishable. */
  svg .abcjs-note { cursor:pointer; }
  svg .selected:not(.past), svg .selected:not(.past) * {
    fill:var(--play-color) !important;
    stroke:var(--play-color) !important;
  }
  svg .selected:not(.past) {
    filter: drop-shadow(0 1px 1px rgba(15,23,42,.4))
            drop-shadow(0 0 7px var(--play-glow))
            drop-shadow(0 0 18px var(--play-glow)) !important;
    animation: note-selected-pulse 1.1s ease-in-out infinite;
  }
  /* A selected note that the cursor has passed stays gray (played rule),
     but keeps a lane-colored outline so the selection is still visible. */
  svg .selected.past, svg .selected.past * {
    fill:#374151 !important;
    stroke:var(--play-color) !important;
    stroke-width:1.2px;
  }
  svg .selected.past {
    filter: drop-shadow(0 0 6px var(--play-glow)) !important;
  }
  @keyframes note-selected-pulse {
    0%, 100% {
      filter: drop-shadow(0 1px 1px rgba(15,23,42,.4))
              drop-shadow(0 0 6px var(--play-glow))
              drop-shadow(0 0 14px var(--play-glow));
    }
    50% {
      filter: drop-shadow(0 1px 1px rgba(15,23,42,.4))
              drop-shadow(0 0 10px var(--play-glow))
              drop-shadow(0 0 26px var(--play-glow));
    }
  }
  .note-info { color:#1e3a8a; font-size:12px; background:#eff6ff;
    border:1px solid #bfdbfe; border-radius:999px; padding:3px 9px; }
  .note-info:empty { display:none; }
  .lane-legend { display:flex; flex-wrap:wrap; align-items:center;
    gap:8px 14px; margin-top:9px; color:#475569; font-size:12px; }
  .lane-hint { color:#94a3b8; }
  .lane-key { display:inline-flex; align-items:center; gap:5px; }
  .lane-key i { width:10px; height:10px; border-radius:50%; display:inline-block;
    background:var(--key-color); box-shadow:0 0 6px var(--key-glow); }
  .lane-key.vocal { --key-color:#22c55e; --key-glow:rgba(34,197,94,.8); }
  .lane-key.rh    { --key-color:#7dd3fc; --key-glow:rgba(56,189,248,.6); }
  .lane-key.lh    { --key-color:#c4b5fd; --key-glow:rgba(167,139,250,.6); }
  .lane-key.bass  { --key-color:#fbbf24; --key-glow:rgba(251,191,36,.65); }
  .lane-key.melody { --key-color:#22c55e; --key-glow:rgba(34,197,94,.8);
    font-weight:700; color:#166534; }
  .bass-note { color:#b45309; font-weight:700; }
  .legend { color:#64748b; font-size:12px; margin-top:8px; }
  .bass-details { margin-top:12px; background:#fff; border:1px solid #dbe2ea;
    border-radius:10px; padding:10px 12px; }
  .bass-details summary { cursor:pointer; font-weight:700; color:#0f172a; }
  .bass-count { color:#0284c7; font-weight:600; margin-left:6px; }
  .bass-legend { color:#64748b; font-size:12px; margin:5px 0 7px; }
  .bass-table-wrap { max-height:190px; overflow:auto; border:1px solid #eef2f7;
    border-radius:6px; }
  .bass-table { width:100%; border-collapse:collapse; font-size:12px;
    font-variant-numeric:tabular-nums; }
  .bass-table th { position:sticky; top:0; background:#f8fafc; color:#475569;
    text-align:left; padding:5px 8px; border-bottom:1px solid #e2e8f0; }
  .bass-table td { padding:4px 8px; border-bottom:1px solid #f1f5f9;
    color:#334155; }
  .bass-table tr:last-child td { border-bottom:0; }
  .bass-table .role { color:#0284c7; font-weight:600; }
  .error { color:#dc2626; margin-top:8px; }
  /* embedded in the music client: same player, no page chrome */
  body.embed { background:#fff; }
  body.embed .wrap { max-width:none; margin:0; padding:0; }
  body.embed h1, body.embed .sub, body.embed .metrics, body.embed .legend { display:none; }
  body.embed .lang-switch { display:none; }
  body.embed .modebar { margin:0; padding:8px 10px 0; }
  body.embed .shell { border-radius:0; border-left:0; border-right:0; }
  body.embed .controls { margin:0; padding:8px 10px 10px; }
</style>
</head>
<body>
<div class="lang-switch" role="group" aria-label="Language">
  <button type="button" data-lang-button="en">EN</button><span>/</span><button type="button" data-lang-button="zh">中文</button>
</div>
<div class="wrap">
  <h1 id="pageTitle" data-i18n="staff.title">Piano staff — Reaper 风格滚动五线谱</h1>
  <p class="sub" id="pageSub" data-i18n="staff.subtitle">
    三轨：RH / LH / Bass；整首谱面是一条长行。
  </p>
  <div class="modebar" id="modebar">
    <button id="btnA" class="active" data-i18n="staff.modeA">A · 识别</button>
    <button id="btnB" data-i18n="staff.modeB">B · 编曲</button>
    <span id="modeInfo"></span>
  </div>
  <div class="shell" id="shell">
    <div id="track"></div>
    <div id="playhead"><div class="line"></div><div class="arrow"></div></div>
  </div>
  <div class="controls">
    <button id="playBtn" class="primary" data-i18n="staff.play">▶ 播放</button>
    <button id="replayBtn" data-i18n="staff.replay">↻ 重新播放</button>
    <button id="stopBtn" data-i18n="staff.stop">■ 停止</button>
    <span id="timeLabel">0:00 / 1:00</span>
    <span id="noteInfo" class="note-info"></span>
    <span class="hint" data-i18n="staff.clickHint">点击音符：选中并试听</span>
  </div>
  <details class="bass-details" id="bassDetails" open style="display:none">
    <summary><span data-i18n="staff.bassDetails">Bass line details</span> <span class="bass-count" id="bassCount"></span></summary>
    <div class="bass-legend" id="bassLegend"></div>
    <div class="bass-table-wrap">
      <table class="bass-table" id="bassTable"></table>
    </div>
  </details>
  <div class="lane-legend" id="laneLegend"></div>
  <div class="metrics" id="metrics"></div>
  <div class="legend" id="legend" data-i18n="staff.abLegend">
    A 是原始音频的真实 note events（RH/LH/Bass 按音域分轨）；
    B 的 RH 来自 SheetSage2 旋律，LH/Bass 由 chord.lab 生成。
  </div>
  <div class="error" id="error"></div>
</div>
<audio id="audio" preload="auto"></audio>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const shell = document.getElementById('shell');
  const track = document.getElementById('track');
  const playhead = document.getElementById('playhead');
  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const replayBtn = document.getElementById('replayBtn');
  const stopBtn = document.getElementById('stopBtn');
  const timeLabel = document.getElementById('timeLabel');
  const noteInfo = document.getElementById('noteInfo');
  const modeInfo = document.getElementById('modeInfo');
  const metricsBox = document.getElementById('metrics');
  const laneLegend = document.getElementById('laneLegend');
  const bassBox = document.getElementById('bassDetails');
  const bassCount = document.getElementById('bassCount');
  const bassLegend = document.getElementById('bassLegend');
  const bassTable = document.getElementById('bassTable');
  const errorBox = document.getElementById('error');
  const pageTitle = document.getElementById('pageTitle');
  const pageSub = document.getElementById('pageSub');
  const legend = document.getElementById('legend');
  const modebar = document.getElementById('modebar');
  const session = params.get('session') || 'e58dd3f11a2f';
  const explicitMode = params.get('mode');
  const embed = params.get('embed') === '1';
  const tr = (key, vars) => (window.VeloxI18n
    ? window.VeloxI18n.t(key, vars) : key);
  const i18nReady = window.VeloxI18n
    ? window.VeloxI18n.init() : Promise.resolve('zh');
  if (embed) document.body.classList.add('embed');

  let mode = (explicitMode === 'a' || explicitMode === 'b' ||
              explicitMode === 'sheet') ? explicitMode : 'a';
  let data = null, parts = [], notes = [], duration = 60;
  let bars = 0, barSeconds = 1;
  let startX = 0, anchors = [];
  let scrollX = 0, stopped = true;
  let lastActive = new Set(), lastPast = new Set();
  let lastPost = 0;
  let selectedGroup = null;
  let groupMeta = new WeakMap();
  let auditionCtx = null;

  const fmt = value => {
    const seconds = Math.max(0, Math.floor(value || 0));
    return Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
  };
  const setPlayIcon = playing => {
    playBtn.textContent = playing ? tr('staff.pause') : tr('staff.play');
  };
  const notify = (type, extra) => {
    if (window.parent === window) return;
    try {
      window.parent.postMessage(Object.assign({type}, extra), '*');
    } catch (e) { /* ignore */ }
  };
  const postState = playing => {
    notify('velox-staff-state', {
      t: audio.currentTime || 0, duration, playing, mode,
    });
  };
  const postHeight = () => {
    if (window.parent === window) return;
    requestAnimationFrame(() => {
      // documentElement.scrollHeight is at least the iframe viewport; body's
      // box is the real content height (embed mode has no outer margins).
      const height = Math.ceil(document.body.getBoundingClientRect().height);
      notify('velox-staff-height', {height});
    });
  };

  function collectNotes(staff) {
    // Return one entry per *onset*, tagged with the printed measure number.
    // ABCJS keeps tied notes as separate note events (the continuation
    // carries startTie); fold those elements into the onset they belong to.
    // Pairing backend events by measure (below) survives rests/ties much
    // better than a single flat index across the whole piece.
    const out = [];
    if (!staff || !staff.voices) return out;
    for (const ev of staff.voices[0] || []) {
      if (ev.el_type !== 'note' || ev.rest) continue;
      const elems = ev.abselem && ev.abselem.elemset;
      if (!elems || !elems.length) continue;
      // ABCJS marks the note that *opens* a tie with startTie and the note
      // that *closes* it with endTie; only the closing note is a continuation.
      const tiedFromPrevious = (ev.pitches || []).some(
        pitch => Boolean(pitch.endTie));
      if (tiedFromPrevious && out.length) {
        out[out.length - 1].elements.push(...elems);
        continue;
      }
      let measure = null;
      for (const element of elems) {
        measure = measureOf(element);
        if (measure !== null) break;
      }
      const pitches = (ev.pitches || [])
        .map(pitch => abcPitchToMidi(pitch.name))
        .filter(Number.isFinite)
        .sort((a, b) => a - b);
      out.push({elements: [...elems], measure, pitches});
    }
    return out;
  }

  function noteX(elements) {
    if (!elements || !elements.length) return null;
    let element = elements.find(el => el.classList &&
      el.classList.contains('abcjs-notehead'));
    if (!element) element = elements.find(el => el.tagName === 'path');
    if (!element) element = elements[0];
    const box = element.getBoundingClientRect();
    const trackBox = track.getBoundingClientRect();
    if (!box.width && !box.height) return null;
    return box.left - trackBox.left + box.width / 2;
  }

  function measureOf(element) {
    for (const cls of element.classList || []) {
      const match = cls.match(/^abcjs-m(\d+)$/);
      if (match) return parseInt(match[1], 10);
    }
    return null;
  }

  function buildTimeMap(staves) {
    const trackBox = track.getBoundingClientRect();
    const barX = new Map();
    const firstStaff = track.querySelector('.abcjs-staff');
    if (firstStaff) {
      for (const bar of firstStaff.querySelectorAll('.abcjs-bar')) {
        const measure = measureOf(bar);
        if (measure === null) continue;
        const box = bar.getBoundingClientRect();
        barX.set(measure, box.left - trackBox.left);
      }
    }

    // Start of the first measure: just right of clef/key/time-signature.
    // ABCJS keeps those glyphs as siblings of the .abcjs-staff group, inside
    // .abcjs-staff-wrapper, so query the wrapper rather than the staff line.
    startX = 0;
    const wrapper = firstStaff &&
      (firstStaff.closest('.abcjs-staff-wrapper') ||
       firstStaff.parentElement);
    if (wrapper) {
      for (const extra of wrapper.querySelectorAll(
          '.abcjs-clef, .abcjs-key-signature, .abcjs-time-signature')) {
        const box = extra.getBoundingClientRect();
        startX = Math.max(startX, box.right - trackBox.left);
      }
    }
    if (!startX && firstStaff) {
      const staffLine = firstStaff.querySelector('.abcjs-top-line');
      if (staffLine) {
        const box = staffLine.getBoundingClientRect();
        startX = box.left - trackBox.left;
      }
    }
    if (!startX) {
      const firstNote = notes.map(n => n.x).find(x => x !== null);
      startX = firstNote || 0;
    }

    const measureTime = new Map();
    const measures = (data && data.measures) || [];
    if (measures.length) {
      // Use the real measure boundaries from playback.json: the first bar
      // may be a pickup, and a performance may not be metronomic.
      for (const measure of measures) {
        const index = Number(measure.bar);
        const startTime = Number(measure.start);
        const endTime = Number(measure.end);
        if (!Number.isFinite(startTime) || !Number.isFinite(endTime)) continue;
        if (index > 0 && barX.has(index - 1)) {
          measureTime.set(roundTime(startTime), barX.get(index - 1));
        }
        if (barX.has(index)) {
          measureTime.set(roundTime(endTime), barX.get(index));
        }
      }
    } else {
      for (let measure = 0; measure < bars; measure++) {
        if (barX.has(measure)) {
          measureTime.set(roundTime((measure + 1) * barSeconds),
                          barX.get(measure));
        }
      }
    }

    // Exact notehead anchors: every onset maps to the notehead's centre.
    // This is what keeps the cursor glued to the score instead of drifting
    // through rests.  Notes from all three staves at the same onset should
    // share the same x, so average them.
    const onsetX = new Map();
    for (const note of notes) {
      if (note.x === null) continue;
      const key = roundTime(
        note.start !== undefined ? note.start : note.q_start);
      const entry = onsetX.get(key) || {sum: 0, count: 0};
      entry.sum += note.x;
      entry.count += 1;
      onsetX.set(key, entry);
    }
    const all = [{t: 0, x: startX}];
    for (const [time, x] of measureTime) all.push({t: time, x});
    for (const [time, entry] of onsetX) {
      all.push({t: time, x: entry.sum / entry.count});
    }
    all.sort((a, b) => a.t - b.t || a.x - b.x);

    anchors = [];
    for (const point of all) {
      if (!Number.isFinite(point.t) || !Number.isFinite(point.x)) continue;
      if (point.t < 0) continue;
      const prev = anchors[anchors.length - 1];
      if (prev && Math.abs(prev.t - point.t) < 1e-4) {
        // keep the later/higher x for the same musical instant
        if (point.x > prev.x) prev.x = point.x;
        continue;
      }
      // barlines and noteheads are laid out left-to-right; guard against a
      // transient zero-width element producing a backwards anchor.
      if (prev && point.x < prev.x) point.x = prev.x;
      anchors.push(point);
    }
    if (!anchors.length) anchors = [{t: 0, x: 0}];
    if (duration > anchors[anchors.length - 1].t) {
      anchors.push({t: duration, x: anchors[anchors.length - 1].x});
    }
  }

  function roundTime(value) {
    return Math.round((Number(value) || 0) * 10000) / 10000;
  }

  function xAtTime(time) {
    if (!anchors.length) return 0;
    if (time <= anchors[0].t) return anchors[0].x;
    for (let i = 0; i < anchors.length - 1; i++) {
      const a = anchors[i], b = anchors[i + 1];
      if (time < b.t) {
        const span = Math.max(1e-6, b.t - a.t);
        const fraction = Math.max(0, Math.min(1, (time - a.t) / span));
        return a.x + (b.x - a.x) * fraction;
      }
    }
    return anchors[anchors.length - 1].x;
  }

  function timeAtX(x) {
    if (!anchors.length) return 0;
    if (x <= anchors[0].x) return anchors[0].t;
    for (let i = 0; i < anchors.length - 1; i++) {
      const a = anchors[i], b = anchors[i + 1];
      if (x < b.x) {
        const span = Math.max(1e-6, b.x - a.x);
        const fraction = Math.max(0, Math.min(1, (x - a.x) / span));
        return a.t + (b.t - a.t) * fraction;
      }
    }
    return anchors[anchors.length - 1].t;
  }

  function collectAbcGroupPitches(allStaves) {
    const pitches = new Map();
    for (const staff of allStaves || []) {
      for (const voice of staff.voices || []) {
        for (const event of voice || []) {
          if (event.el_type !== 'note' || event.rest) continue;
          const midis = (event.pitches || [])
            .map(pitch => abcPitchToMidi(pitch.name))
            .filter(Number.isFinite);
          if (!midis.length) continue;
          for (const element of
              (event.abselem && event.abselem.elemset) || []) {
            const group = element.closest &&
              element.closest('.abcjs-note');
            if (group && !pitches.has(group)) pitches.set(group, midis);
          }
        }
      }
    }
    return pitches;
  }

  // collectNotes folds tied continuations into their onset where possible.
  // A few printed tie segments can still be left without a backend event;
  // give every remaining `.abcjs-note` a pitch/time fallback so click-to-audition
  // works everywhere, not just on the first segment of a tie.
  function fillMissingGroupMeta(allStaves) {
    const abcPitches = collectAbcGroupPitches(allStaves);
    for (const group of track.querySelectorAll('.abcjs-note')) {
      if (groupMeta.has(group)) continue;
      const midis = abcPitches.get(group) || [];
      const x = noteX([group]);
      const start = x === null ? 0 : Math.max(0, timeAtX(x));
      const partName = partForGroup(group);
      if (partName) {
        group.classList.add('track-' + partName.toLowerCase());
        if (partName === 'Vocal' ||
            (partName === 'RH' &&
             !parts.some(part => part.name === 'Vocal'))) {
          group.classList.add('melody');
        }
      }
      const note = {
        pitches: midis,
        start,
        end: start + 0.5,
        bar: null,
        part: partName,
        elements: [group],
        group,
        x,
      };
      groupMeta.set(group, {note, part: partName});
    }
  }

  function clearHighlights() {
    for (const note of notes) for (const el of note.elements) {
      el.classList.remove('playing');
      el.classList.remove('past');
    }
    lastActive = new Set();
    lastPast = new Set();
  }

  function updateHighlights(time, isPlaying) {
    // Highlight the notation under the cursor instead of using raw event
    // windows. Quantized printed bars and performance-time note events can
    // drift apart; an x-based state machine guarantees that a note left of the
    // cursor is immediately `.past` (gray) and only notes at the cursor glow.
    const cursorX = xAtTime(time);
    const active = new Set();
    const past = new Set();
    const windowPx = 14;
    for (const note of notes) {
      if (note.x === null || !Number.isFinite(note.x)) continue;
      if (note.x < cursorX - windowPx) {
        past.add(note);
      } else if (isPlaying &&
                 Math.abs(note.x - cursorX) <= windowPx) {
        active.add(note);
      }
    }
    for (const note of notes) {
      const on = active.has(note);
      if (lastActive.has(note) !== on) {
        for (const el of note.elements) el.classList.toggle('playing', on);
      }
      const done = past.has(note);
      if (lastPast.has(note) !== done) {
        for (const el of note.elements) el.classList.toggle('past', done);
      }
    }
    lastActive = active;
    lastPast = past;
  }

  function resetView() {
    scrollX = 0;
    track.style.transform = 'translateX(0px)';
    playhead.style.transform = 'translateX(' + xAtTime(0) + 'px)';
    timeLabel.textContent = '0:00 / ' + fmt(duration);
    clearHighlights();
  }

  function frame(now) {
    if (!data) {
      requestAnimationFrame(frame);
      return;
    }
    if (stopped) {
      resetView();
    } else {
      const time = audio.currentTime || 0;
      const position = xAtTime(time);
      const half = shell.clientWidth / 2;
      // No easing: the staff position and the playhead are derived from the
      // exact same time->x map on every frame, so they cannot misalign.
      const targetScroll = Math.max(0, position - half);
      scrollX = targetScroll;
      track.style.transform = 'translateX(' + (-scrollX) + 'px)';
      playhead.style.transform = 'translateX(' + (position - scrollX) + 'px)';
      updateHighlights(time, !audio.paused);
      timeLabel.textContent = fmt(time) + ' / ' + fmt(duration);
    }
    if (now - lastPost > 120) {
      lastPost = now;
      postState(!audio.paused && !stopped);
    }
    requestAnimationFrame(frame);
  }

  function renderLaneLegend(melodyName) {
    if (!laneLegend) return;
    const keys = parts.map(part => {
      const key = part.name.toLowerCase();
      const isMelody = part.name === melodyName;
      let label = part.name;
      if (part.name === 'Vocal') {
        label = tr('staff.lane.vocal');
      } else if (part.name === 'RH') {
        label = isMelody ? tr('staff.lane.rhMelodyRecognized') :
          (mode === 'sheet' ? tr('staff.lane.rhInsHigh') :
            tr('staff.lane.rhMelody'));
      } else if (part.name === 'LH') {
        label = mode === 'a' ? tr('staff.lane.lhLeft') :
          tr('staff.lane.lhGenerated');
      } else if (part.name === 'Bass') {
        label = mode === 'a' ? tr('staff.lane.bassRecognized') :
          tr('staff.lane.bassGenerated');
      }
      return '<span class="lane-key ' + key +
        (isMelody ? ' melody' : '') + '"><i></i>' +
        escapeHtml(label) + '</span>';
    });
    laneLegend.innerHTML =
      '<span class="lane-hint">' + escapeHtml(tr('staff.lane.playing')) +
      '</span>' + keys.join('') +
      '<span class="lane-hint">' + escapeHtml(tr('staff.lane.default')) +
      '</span>';
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[ch]));
  }

  function findNoteGroups(elements) {
    const groups = [];
    const seen = new Set();
    for (const element of elements || []) {
      if (!element || !element.closest) continue;
      const group = element.closest('.abcjs-note');
      if (group && !seen.has(group)) {
        seen.add(group);
        groups.push(group);
      }
    }
    return groups;
  }

  const MIDI_NAMES = ['C', 'D♭', 'D', 'E♭', 'E', 'F',
    'G♭', 'G', 'A♭', 'A', 'B♭', 'B'];
  function midiName(value) {
    const midi = Math.round(Number(value));
    if (!Number.isFinite(midi)) return '';
    const pitch = ((midi % 12) + 12) % 12;
    return MIDI_NAMES[pitch] + (Math.floor(midi / 12) - 1);
  }

  function abcPitchToMidi(name) {
    const match = String(name || '').match(
      /^(\^{1,2}|_{1,2}|=)?([A-Ga-g])([',]*)$/);
    if (!match) return NaN;
    let accidental = 0;
    if (match[1] && match[1][0] === '^') accidental = match[1].length;
    if (match[1] && match[1][0] === '_') accidental = -match[1].length;
    const letter = match[2];
    const semitone = {C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11}[
      letter.toUpperCase()];
    if (semitone === undefined) return NaN;
    let octave = letter === letter.toUpperCase() ? 4 : 5;
    for (const mark of match[3]) octave += mark === "'" ? 1 : -1;
    return (octave + 1) * 12 + semitone + accidental;
  }

  function partForGroup(group) {
    const meta = groupMeta.get(group);
    if (meta && meta.part) return meta.part;
    for (const cls of group.classList || []) {
      const match = cls.match(/^abcjs-v(\d+)$/);
      if (match) {
        const part = parts[Number(match[1])];
        if (part) return part.name;
      }
    }
    return '';
  }

  function clearNoteSelection() {
    if (selectedGroup) selectedGroup.classList.remove('selected');
    selectedGroup = null;
    if (noteInfo) noteInfo.textContent = '';
  }

  function ensureAuditionContext() {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    if (!auditionCtx) auditionCtx = new Ctx();
    if (auditionCtx.state === 'suspended') {
      auditionCtx.resume().catch(() => {});
    }
    return auditionCtx;
  }

  // Audition the printed pitches with a small additive piano-like voice.
  // Using the notation itself (instead of seeking the mix) means the generated
  // RH/LH/Bass notes can be heard even when they are not present in the mix.
  function auditionMidis(midis, durationHint) {
    if (!midis || !midis.length) return;
    const ctx = ensureAuditionContext();
    if (!ctx) return;
    const now = ctx.currentTime + 0.02;
    const noteDuration = Math.max(
      0.35, Math.min(1.8, Number(durationHint) || 0.7));
    const bus = ctx.createGain();
    bus.gain.setValueAtTime(
      Math.min(0.2, 0.18 / Math.sqrt(midis.length)), now);
    const limiter = ctx.createDynamicsCompressor();
    limiter.threshold.value = -12;
    limiter.knee.value = 18;
    limiter.ratio.value = 6;
    limiter.attack.value = 0.003;
    limiter.release.value = 0.25;
    bus.connect(limiter);
    limiter.connect(ctx.destination);
    const partials = [
      {ratio: 1, gain: 0.85, type: 'triangle'},
      {ratio: 2, gain: 0.22, type: 'sine'},
      {ratio: 3, gain: 0.08, type: 'sine'},
    ];
    const stopAt = now + noteDuration + 0.08;
    for (const midi of midis) {
      const frequency = 440 * Math.pow(2, (midi - 69) / 12);
      for (const partial of partials) {
        const osc = ctx.createOscillator();
        osc.type = partial.type;
        osc.frequency.setValueAtTime(frequency * partial.ratio, now);
        const env = ctx.createGain();
        env.gain.setValueAtTime(0.0001, now);
        env.gain.exponentialRampToValueAtTime(
          partial.gain, now + 0.012);
        env.gain.exponentialRampToValueAtTime(0.0001, now + noteDuration);
        osc.connect(env);
        env.connect(bus);
        osc.start(now);
        osc.stop(stopAt);
      }
    }
    window.setTimeout(() => {
      try {
        bus.disconnect();
        limiter.disconnect();
      } catch (e) { /* already gone */ }
    }, (noteDuration + 0.25) * 1000);
  }

  function onTrackClick(event) {
    const target = event.target;
    const group = target && target.closest
      ? target.closest('.abcjs-note') : null;
    if (!group || !track.contains(group)) {
      clearNoteSelection();
      return;
    }
    if (selectedGroup && selectedGroup !== group) {
      selectedGroup.classList.remove('selected');
    }
    selectedGroup = group;
    group.classList.add('selected');

    const meta = groupMeta.get(group) || null;
    const note = meta && meta.note;
    const abcMidis = (group.midiPitches || [])
      .map(item => Number(item && item.pitch))
      .filter(value => Number.isFinite(value) && value >= 0 && value <= 127);
    const fallbackMidis = ((note && note.pitches) || [])
      .map(Number).filter(value => Number.isFinite(value));
    const midis = abcMidis.length ? abcMidis : fallbackMidis;

    const start = note && Number.isFinite(Number(note.start))
      ? Number(note.start)
      : (group.midiPitches && group.midiPitches[0]
          ? Number(group.midiPitches[0].start) || 0 : 0);
    const durationHint = note && Number.isFinite(Number(note.end))
      ? Number(note.end) - start
      : (group.midiPitches && group.midiPitches[0]
          ? Number(group.midiPitches[0].duration) : 0.7);

    if (noteInfo) {
      const names = midis.map(midiName).filter(Boolean).join(' ');
      const stamp = Math.floor(start / 60) + ':' +
        (start % 60).toFixed(1).padStart(4, '0');
      const lane = partForGroup(group);
      noteInfo.textContent = tr('staff.audition', {
        notes: names || '—',
        time: stamp,
        lane: lane || '',
      }).replace(/\s*·\s*$/, '');
    }
    auditionMidis(midis, durationHint);
  }

  function updateMetrics() {
    const metrics = (data && data.metrics) || {};
    if (mode === 'sheet') {
      const counts = parts.map(
        part => part.name + ' ' + part.events.length).join(' · ');
      metricsBox.classList.add('single');
      const names = parts.map(part => part.name);
      const hasVocal = names.includes('Vocal');
      metricsBox.innerHTML = `
        <div class="card active">
          <h3>SheetSage2</h3>
          <div class="big">${counts}</div>
          <p>${escapeHtml(hasVocal
            ? tr('staff.metricsSheetVocal')
            : tr('staff.metricsSheetInstrumental'))}</p>
          <p>${escapeHtml(tr('staff.metricsSummary', {
            duration: duration.toFixed(1), bars,
            meter: data.meter || '—', tempo: data.tempo || '—',
          }))}</p>
        </div>`;
      return;
    }
    const a = metrics.A || {}, b = metrics.B || {};
    metricsBox.classList.remove('single');
    metricsBox.innerHTML = `
      <div class="card ${mode === 'a' ? 'active' : ''}">
        <h3>${escapeHtml(tr('staff.metricA'))}</h3>
        <div class="big">${escapeHtml(tr('staff.metricNotes', {
          notes: a.notes || '—', dtw: a.chroma_dtw || '—',
        }))}</div>
        <p>${escapeHtml(tr('staff.metricADesc'))}</p>
        <p>${escapeHtml([a.range || '', tr('staff.metricCoverage')]
          .filter(Boolean).join(' · '))}</p>
      </div>
      <div class="card ${mode === 'b' ? 'active' : ''}">
        <h3>${escapeHtml(tr('staff.metricB'))}</h3>
        <div class="big">${escapeHtml(tr('staff.metricNotes', {
          notes: b.notes || '—', dtw: b.chroma_dtw || '—',
        }))}</div>
        <p>${escapeHtml(tr('staff.metricBDesc'))}</p>
        <p>${escapeHtml([b.range || '', tr('staff.metricCoverage')]
          .filter(Boolean).join(' · '))}</p>
      </div>`;
  }

  function fmtBassTime(value) {
    const seconds = Math.max(0, Number(value) || 0);
    return Math.floor(seconds / 60) + ':' +
      (seconds % 60).toFixed(1).padStart(4, '0');
  }

  function updateBassDetails() {
    const rows = (data && data.bass_details) || [];
    if (!bassBox) return;
    if (!rows.length) {
      bassBox.style.display = 'none';
      return;
    }
    bassBox.style.display = 'block';
    bassBox.open = true;
    const names = parts.map(part => part.name);
    const hasVocal = names.includes('Vocal');
    bassCount.textContent = tr('staff.bassCount', {count: rows.length});
    const recognized = (data.bass_details || []).some(
      row => row.source === 'recognized');
    bassLegend.textContent = recognized
      ? tr('staff.bassRecognizedLegend')
      : tr('staff.bassGeneratedLegend');
    const roleText = role => ({
      root: tr('staff.role.root'),
      fifth: tr('staff.role.fifth'),
      octave: tr('staff.role.octave'),
      'chord tone': tr('staff.role.chordTone'),
      recognized: tr('staff.role.recognized'),
    }[role] || role);
    const body = rows.map(row => `
      <tr>
        <td>${fmtBassTime(row.time)}</td>
        <td>${row.bar == null ? '—' : (row.bar + 1)}</td>
        <td class="bass-note">${row.note || '—'}</td>
        <td>${row.chord || '—'}</td>
        <td class="role">${escapeHtml(roleText(row.role || ''))}</td>
        <td>${escapeHtml(row.source === 'recognized'
          ? tr('staff.source.recognized') : tr('staff.source.generated'))}</td>
      </tr>`).join('');
    bassTable.innerHTML =
      '<thead><tr><th>' + escapeHtml(tr('staff.bassTable.time')) +
      '</th><th>' + escapeHtml(tr('staff.bassTable.bar')) +
      '</th><th>' + escapeHtml(tr('staff.bassTable.note')) +
      '</th><th>' + escapeHtml(tr('staff.bassTable.chord')) +
      '</th><th>' + escapeHtml(tr('staff.bassTable.role')) +
      '</th><th>' + escapeHtml(tr('staff.bassTable.source')) +
      '</th></tr></thead><tbody>' + body + '</tbody>';
    if (hasVocal) {
      bassLegend.textContent += ' ' + tr('staff.bassVocalNote');
    }
  }

  async function loadMode(next) {
    clearNoteSelection();
    groupMeta = new WeakMap();
    mode = next;
    document.getElementById('btnA').classList.toggle('active', mode === 'a');
    document.getElementById('btnB').classList.toggle('active', mode === 'b');
    stopped = true;
    audio.pause();
    audio.currentTime = 0;

    const response = await fetch('/piano-staff/data?session=' +
      encodeURIComponent(session) + '&mode=' + encodeURIComponent(mode));
    if (!response.ok) {
      let detail = 'data HTTP ' + response.status;
      try { detail = (await response.json()).detail || detail; } catch (e) { /* */ }
      throw new Error(detail);
    }
    data = await response.json();
    duration = Number(data.duration) || 60;
    bars = Number(data.bars) || 0;
    barSeconds = Number(data.bar_seconds) ||
      (bars ? duration / bars : 1);
    audio.src = data.audio_url;
    audio.load();

    track.innerHTML = '';
    const staffWidth = Math.max(2400, Math.min(48000,
      Math.round(duration * 150)));
    const tunes = ABCJS.renderAbc(track, data.abc, {
      staffwidth: staffWidth,
      wrap: false,
      oneSvgPerLine: false,
      add_classes: true,
      scale: 1.05,
      paddingtop: 8,
      paddingbottom: 10,
    });
    const tune = tunes && tunes[0];
    if (!tune) throw new Error(tr('staff.error.abcFailed'));

    const lines = tune.lines || [];
    const allStaves = lines.flatMap(line => line.staff || []);
    if (!bars) bars = Number(data.bars) || 0;
    if (allStaves.length !== (data.parts || []).length) {
      console.warn('staff/part count mismatch',
                   allStaves.length, (data.parts || []).length);
    }

    parts = (data.parts || []).map((part, index) => {
      const staff = allStaves[index];
      const rendered = collectNotes(staff);
      return Object.assign({}, part, {
        rendered,
        noteElements: rendered.map(entry => entry.elements),
      });
    });

    const melodyName = parts.some(part => part.name === 'Vocal')
      ? 'Vocal' : 'RH';
    for (const part of parts) {
      const key = 'track-' + part.name.toLowerCase();
      for (const entry of part.rendered) {
        for (const element of entry.elements) {
          element.classList.add(key);
          if (part.name === melodyName) element.classList.add('melody');
        }
        for (const group of findNoteGroups(entry.elements)) {
          group.classList.add(key);
          if (part.name === melodyName) group.classList.add('melody');
        }
      }
    }
    renderLaneLegend(melodyName);

    const samePitches = (a, b) => {
      const left = (a || []).map(Number).sort((x, y) => x - y);
      const right = (b || []).map(Number).sort((x, y) => x - y);
      return left.length === right.length &&
        left.every((value, index) => value === right[index]);
    };

    notes = [];
    for (const part of parts) {
      // Backend events and printed ABC notes can differ around ties: ABC
      // prints continuation segments while the event list only has the
      // onset. Match by measure + pitch set instead of by a fragile ordinal
      // index, then allow a small bar tolerance for notes printed just across
      // a barline. This keeps highlight timing tied to the heard onsets.
      const usedEvents = new Set();
      const matchedEntries = new Set();
      const entryForEvent = new Map();
      let cursor = 0;
      for (const entry of part.rendered) {
        const measure = entry.measure === null ? null : Number(entry.measure);
        let found = -1;
        for (let j = cursor; j < part.events.length; j++) {
          if (usedEvents.has(j)) continue;
          const eventBar = Number(part.events[j].bar);
          if (measure !== null && Number.isFinite(eventBar) &&
              eventBar > measure) break;
          if ((measure === null || eventBar === measure) &&
              samePitches(part.events[j].pitches, entry.pitches)) {
            found = j;
            break;
          }
        }
        if (found >= 0) {
          usedEvents.add(found);
          matchedEntries.add(entry);
          entryForEvent.set(found, entry);
          cursor = found + 1;
        }
      }

      // Second pass: a printed note can sit one bar after its event's bar
      // (tie/pickup edge cases). Choose the nearest unused same-pitch event.
      for (const entry of part.rendered) {
        if (matchedEntries.has(entry)) continue;
        const measure = entry.measure === null ? null : Number(entry.measure);
        let best = -1, bestDelta = Infinity;
        for (let j = 0; j < part.events.length; j++) {
          if (usedEvents.has(j)) continue;
          if (!samePitches(part.events[j].pitches, entry.pitches)) continue;
          const eventBar = Number(part.events[j].bar);
          const delta = measure === null || !Number.isFinite(eventBar)
            ? 99 : Math.abs(eventBar - measure);
          if (delta < bestDelta) {
            bestDelta = delta;
            best = j;
          }
        }
        if (best >= 0 && bestDelta <= 4) {
          usedEvents.add(best);
          matchedEntries.add(entry);
          entryForEvent.set(best, entry);
        }
      }

      for (let j = 0; j < part.events.length; j++) {
        const event = part.events[j];
        const entry = entryForEvent.get(j);
        const elements = entry ? [...entry.elements] : [];
        const groups = findNoteGroups(elements);
        for (const group of groups) {
          if (!elements.includes(group)) elements.push(group);
        }
        const note = Object.assign({}, event, {
          elements,
          group: groups[0] || null,
          part: part.name,
          x: noteX(elements),
        });
        notes.push(note);
        for (const group of groups) {
          groupMeta.set(group, {note, part: part.name});
        }
      }
    }
    notes.sort((a, b) => a.start - b.start);
    buildTimeMap(allStaves);
    fillMissingGroupMeta(allStaves);
    window.__veloxStaff = {
      get anchors() { return anchors; },
      get notes() { return notes; },
      get parts() { return parts; },
      get groupMeta() { return groupMeta; },
      get tune() { return tune; },
      get data() { return data; },
      get startX() { return startX; },
      get scrollX() { return scrollX; },
      xAtTime,
    };

    const svg = track.querySelector('svg');
    if (svg) {
      const height = svg.getBoundingClientRect().height;
      if (height > 0) {
        shell.style.height = Math.min(680, Math.max(300, height + 16)) + 'px';
      }
    }
    modebar.style.display = mode === 'sheet' ? 'none' : 'flex';
    const voiceNames = parts.map(part => part.name);
    const hasVocal = voiceNames.includes('Vocal');
    modeInfo.textContent = mode === 'sheet'
      ? tr('staff.modeInfoSheet', {voices: voiceNames.join(' / ')})
      : (mode === 'a' ? tr('staff.modeInfoA') : tr('staff.modeInfoB'));
    if (mode === 'sheet') {
      pageTitle.textContent = hasVocal
        ? tr('staff.pageTitleVocal')
        : tr('staff.pageTitleInstrumental');
      pageSub.textContent = hasVocal
        ? tr('staff.sheetSubVocal')
        : tr('staff.sheetSubInstrumental');
      legend.textContent = hasVocal
        ? tr('staff.sheetLegendVocal')
        : tr('staff.sheetLegendInstrumental');
    } else {
      pageTitle.textContent = tr('staff.abTitle');
      pageSub.textContent = tr('staff.abSub');
      legend.textContent = tr('staff.abLegend');
    }
    document.title = pageTitle.textContent;
    updateMetrics();
    updateBassDetails();
    stopped = true;
    setPlayIcon(false);
    resetView();
    postHeight();
  }

  async function chooseMode(next) {
    errorBox.textContent = '';
    try {
      await loadMode(next);
    } catch (error) {
      errorBox.textContent = error.message;
      console.error(error);
    }
  }

  document.getElementById('btnA').onclick = () => chooseMode('a');
  document.getElementById('btnB').onclick = () => chooseMode('b');
  track.addEventListener('click', onTrackClick);
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') clearNoteSelection();
  });
  playBtn.onclick = () => {
    stopped = false;
    if (audio.paused) {
      if (audio.currentTime >= duration - 0.05) audio.currentTime = 0;
      audio.play().catch(error => {
        errorBox.textContent = tr('staff.error.playbackFailed',
          {error: error.message});
      });
    } else {
      audio.pause();
    }
  };
  replayBtn.onclick = () => {
    stopped = false;
    audio.pause();
    audio.currentTime = 0;
    scrollX = 0;
    resetView();
    audio.play().catch(error => {
      errorBox.textContent = tr('staff.error.playbackFailed',
        {error: error.message});
    });
  };
  stopBtn.onclick = () => {
    stopped = true;
    audio.pause();
    audio.currentTime = 0;
    scrollX = 0;
    setPlayIcon(false);
    resetView();
    postState(false);
  };
  audio.addEventListener('play', () => {
    stopped = false;
    setPlayIcon(true);
    postState(true);
  });
  audio.addEventListener('pause', () => {
    setPlayIcon(false);
    postState(false);
  });
  audio.addEventListener('seeked', () => postState(!audio.paused));
  audio.addEventListener('ended', () => {
    setPlayIcon(false);
    postState(false);
  });
  audio.addEventListener('error', () => {
    const error = audio.error;
    errorBox.textContent = tr('staff.error.audioFailed', {
      error: error && error.message ? error.message : 'unknown',
    });
  });
  window.addEventListener('resize', () => {
    if (data) resetView();
    postHeight();
  });

  try {
    await i18nReady;
    await loadMode(mode);
    requestAnimationFrame(frame);
  } catch (error) {
    if (!explicitMode && mode === 'a') {
      // Older SheetSage2-only sessions have no piano A artifacts; fall back
      // to the SheetSage2 multi-lane staff instead of failing the page.
      try {
        await loadMode('sheet');
        requestAnimationFrame(frame);
      } catch (fallbackError) {
        errorBox.textContent = tr('staff.error.staffFailed',
          {error: fallbackError.message});
        console.error(fallbackError);
      }
    } else {
      errorBox.textContent = tr('staff.error.staffFailed',
        {error: error.message});
      console.error(error);
    }
  }
})();
</script>
</body>
</html>
